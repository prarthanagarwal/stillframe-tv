}

android {
    namespace 'com.stillframe.cabletv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stillframe.cabletv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
